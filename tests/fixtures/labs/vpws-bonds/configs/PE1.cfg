# Synthetic SAOS 6 configuration for tests: PE1 of the vpws-bonds lab (documentation addresses only).
system set host-name PE1
port set port 1 description "to PE2"
port set port 3 description "customer host c1"
vlan create vlan 100,300
vlan add vlan 100 port 1
vlan add vlan 300 port 3
interface create loopback lb0 ip 192.0.2.1/32
interface create ip-interface core ip 198.51.100.0/31 vlan 100
isis instance create isis-instance CORE level L2 area 49.0001
isis instance set isis-instance CORE net 49.0001.1920.0000.2001.00
isis interface attach ip-interface core isis-instance CORE level L2
mpls l2-vpn create dynamic-vc VC300 pw-id 300 peer 192.0.2.2 ldp-lsp pw-type eth-tagged pw-mode spoke
virtual-switch ethernet create vs VS300
virtual-switch ethernet add vs VS300 port 3
virtual-switch ethernet attach mpls-vc VC300 vs VS300
