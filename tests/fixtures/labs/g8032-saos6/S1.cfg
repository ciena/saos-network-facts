! Sub-ring node the sub-ring passes through: it owns the sub-ring's RPL on its east port.
system set host-name S1
vlan create vlan 1000
vlan add vlan 1000 port 1,2,5
ring-protection logical-ring create logical-ring-name lr2 ring-id 2 west-port 1 east-port 2 guard-time 500 WTR 5
ring-protection virtual-ring create virtual-ring-name vr2 logical-ring lr2 raps-vid 102 sub-ring no-port-termination
ring-protection virtual-ring add ring vr2 vid 1000
ring-protection virtual-ring set ring vr2 east-port-rpl owner
ring-protection virtual-ring set ring vr2 mel 7
