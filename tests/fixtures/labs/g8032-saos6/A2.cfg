! Major ring node: the RPL neighbour end of A1's RPL is not configured on SAOS 6 (no neighbour role exists).
! The virtual-ring commands use the CLI's partial command recognition: "ring" for "ring-protection".
system set host-name A2
vlan create vlan 1000,1001
vlan add vlan 1000,1001 port 1,3
ring-protection logical-ring create logical-ring-name lr1 ring-id 1 west-port 1 east-port 3 WTR 1
ring-protection virtual-ring create virtual-ring-name vr1 logical-ring lr1 raps-vid 100 mel 7
ring virtual-ring add ring vr1 vid 1000-1001
ring virtual-ring set ring vr1 revertive off
ring virtual-ring unset ring vr1 revertive
