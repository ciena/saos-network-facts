! SAOS 8 node of the same sub-ring: the virtual ring protects a virtual switch instead of VLANs.
system set host-name S2
virtual-switch ethernet create vs ring-vs-1 mode vpls
virtual-switch ethernet add vs ring-vs-1 port 1 vlan 1000
virtual-switch ethernet add vs ring-vs-1 port 2 vlan 1000
ring-protection logical-ring create logical-ring-name lr2 ring-id 2 west-port 1 east-port 2 WTR 5
ring-protection virtual-ring create virtual-ring-name vr2 logical-ring lr2 raps-vid 102 mel 7 sub-ring no-port-termination
ring-protection virtual-ring add ring vr2 vs ring-vs-1
