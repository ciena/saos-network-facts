# Synthetic two-PE SR-MPLS lab (the sr-l2 configurations) whose core link rides an optical line
# system: the line system is not a containerlab node, so extra.yaml gives its members, the optical
# spans between them and the PEs' line ports, the two sites and two notes (documentation addresses only).
name: line-system
topology:
  defaults:
    kind: ciena_saos
  nodes:
    PE1:
      type: '5164'
      startup-config: configs/PE1.cfg
    PE2:
      type: '5162'
      startup-config: configs/PE2.xml
