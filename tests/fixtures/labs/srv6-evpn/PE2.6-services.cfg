# Synthetic SAOS 10 configuration for tests: services layer of PE2.
config
oc-if:interfaces interface lo0 config mtu 1500
classifiers classifier VLAN100 filter-entry vtag-stack vtags 1 vlan-id 100
fds fd FD-EVPN-100 mode evpn-vpls
fps fp FP-AC-100 fd-name FD-EVPN-100 logical-port 5 classifier-list VLAN100
classifiers classifier VLAN200 filter-entry vtag-stack vtags 1 vlan-id 200
fds fd FD-VPWS-200 mode evpn-vpws
fps fp FP-AC-200 fd-name FD-VPWS-200 logical-port 5 classifier-list VLAN200
evpn evpn-instances evpn-instance 100 vpls-fd FD-EVPN-100 control-word true
evpn evpn-instances evpn-instance 100 route-distinguisher ip-based value 192.0.2.2:100
evpn evpn-instances evpn-instance 100 vpn-target 0:64500:100 route-target-type both
evpn evpn-instances evpn-instance 100 segment-routing-srv6 locator LOC
evpn evpn-instances evpn-instance 200 vpws-cross-connect-fd FD-VPWS-200 local-service-id 2 remote-service-id 1 control-word false
evpn evpn-instances evpn-instance 200 vpn-target 0:64500:200 route-target-type both
evpn evpn-instances evpn-instance 200 segment-routing-srv6 locator LOC-ALGO128
