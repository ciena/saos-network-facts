# Synthetic SAOS 10 configuration for tests: L3VPN layer of PE2 (VRF CUST-A over SRv6).
config
vrf CUST-A description "L3VPN service A"
fds fd FD-CE-300 mode vpls
oc-if:interfaces interface CE-B config name CE-B type ip vrfName CUST-A
oc-if:interfaces interface CE-B ipv4 addresses address 203.0.113.0 config ip 203.0.113.0 prefix-length 31
oc-if:interfaces interface CE-B config underlay-binding config fd FD-CE-300
classifiers classifier VLAN300 filter-entry vtag-stack vtags 1 vlan-id 300
fps fp FP-CE-300 fd-name FD-CE-300 logical-port 5 classifier-list VLAN300
bgp instance 64500 address-family vpnv4 unicast segment-routing-srv6 locator LOC
bgp instance 64500 address-family vpnv6 unicast segment-routing-srv6 locator LOC
bgp instance 64500 peer-group RR address-family vpnv4 unicast activate true
bgp instance 64500 peer-group RR address-family vpnv6 unicast activate true
bgp instance 64500 vrf CUST-A route-distinguisher 0:64500:2
bgp instance 64500 vrf CUST-A route-target 0:64500:1 direction both
bgp instance 64500 vrf CUST-A vrf-address-family ipv4 unicast peer 203.0.113.1 remote-as 64511 activate true
rib vrf CUST-A ipv4 203.0.113.128/25 next-hop 203.0.113.1 route-preference 10
rib vrf CUST-A ipv4 203.0.113.64/26 outgoing-interface Null0 description "CE-B discard"
