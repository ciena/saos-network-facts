# Synthetic SAOS 10 configuration for tests: L3VPN layer of PE1 (VRF CUST-A over SRv6).
config
vrf CUST-A description "L3VPN service A"
fds fd FD-CE-300 mode vpls
oc-if:interfaces interface CE-A config name CE-A type ip vrfName CUST-A
oc-if:interfaces interface CE-A ipv4 addresses address 198.51.100.0 config ip 198.51.100.0 prefix-length 31
oc-if:interfaces interface CE-A ipv6 addresses address 2001:db8:100:: config ip 2001:db8:100:: prefix-length 127
oc-if:interfaces interface CE-A config underlay-binding config fd FD-CE-300
classifiers classifier VLAN300 filter-entry vtag-stack vtags 1 vlan-id 300
fps fp FP-CE-300 fd-name FD-CE-300 logical-port 5 classifier-list VLAN300
bgp instance 64500 address-family vpnv4 unicast segment-routing-srv6 locator LOC
bgp instance 64500 address-family vpnv6 unicast segment-routing-srv6 locator LOC
bgp instance 64500 peer-group RR address-family vpnv4 unicast activate true
bgp instance 64500 peer-group RR address-family vpnv6 unicast activate true
bgp instance 64500 vrf CUST-A route-distinguisher 0:64500:1
bgp instance 64500 vrf CUST-A route-target 0:64500:1 direction both
bgp instance 64500 vrf CUST-A vrf-address-family ipv4 unicast peer 198.51.100.1 remote-as 64510 activate true
bgp instance 64500 vrf CUST-A vrf-address-family ipv6 unicast peer 2001:db8:100::1 remote-as 64510 activate true
bgp instance 64500 vrf CUST-A vrf-address-family ipv6 unicast segment-routing-srv6 locator LOC-ALGO128
bgp instance 64500 vrf CUST-A vrf-address-family ipv6 unicast route-target 0:64500:6 direction import
rib vrf CUST-A ipv4 198.51.100.128/25 next-hop 198.51.100.1 description "CE-A site LAN"
