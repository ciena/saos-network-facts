# Synthetic SAOS 10 configuration for tests: base layer shared by every node.
config
oc-if:interfaces interface lo0 config name lo0 type loopback description "router id and BGP source"
isis instance CORE level-type level-2
isis instance CORE interfaces interface lo0 interface-type point-to-point
isis instance CORE segment-routing enabled true srgb 16000 23999
te globals named-admin-groups named-admin-group SLOW bit-position 1
segment-routing flex-algorithm 128 flex-algo-metric latency
segment-routing flex-algorithm 128 admin-group exclude-any-admin-group SLOW
isis instance CORE multi-topology-mode enable true
isis instance CORE interfaces interface lo0 address-families address-family ipv6 unicast
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
bgp instance 64500 address-family l2vpn evpn route-reflector true
bgp instance 64500 address-family ipv6 unicast route-reflector true
bgp instance 64500 peer-group CLIENTS remote-as 64500 update-source-interface lo0
bgp instance 64500 peer-group CLIENTS address-family l2vpn evpn activate true route-reflector-client true
bgp instance 64500 peer-group CLIENTS address-family ipv6 unicast activate true route-reflector-client true
