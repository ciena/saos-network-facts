# Synthetic SAOS 10 configuration for tests: L3VPN layer of RR1 (reflects VPNv4 / VPNv6 for the PEs).
config
bgp instance 64500 address-family vpnv4 unicast route-reflector true
bgp instance 64500 address-family vpnv6 unicast route-reflector true
bgp instance 64500 peer-group CLIENTS address-family vpnv4 unicast activate true route-reflector-client true
bgp instance 64500 peer-group CLIENTS address-family vpnv6 unicast activate true route-reflector-client true
