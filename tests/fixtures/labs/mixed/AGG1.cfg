# Synthetic SAOS 6 configuration for tests.
system set host-name AGG1
port set port 1-2 description "to PE3"
port set port 3 description "customer A"
aggregation create agg LAG1
aggregation add agg LAG1 port 1-2
vlan create vlan 100,200
vlan add vlan 100 port LAG1
vlan add vlan 200 port 3
interface create loopback lb0 ip 203.0.113.10/32
interface create ip-interface core1 ip 198.51.100.10/31 vlan 100
interface set gateway 203.0.113.254
isis instance create isis-instance CORE level L2 area 49.0002
isis instance set isis-instance CORE net 49.0002.2030.0011.3010.00
isis interface attach ip-interface core1 isis-instance CORE level L2
isis interface-level set ip-interface core1 level L2 wide-metric 50
mpls l2-vpn create static-vc VC1 pw-id 201 peer 203.0.113.30 in-label 8001 out-label 8002 tp-tunnel-ingr-corout TUN1
mpls l2-vpn create dynamic-vc VC2 pw-id 202 peer 203.0.113.30 ldp-lsp pw-type eth-tagged pw-mode mesh
virtual-switch ethernet create vs VS200
virtual-switch ethernet add vs VS200 port 3
virtual-switch ethernet attach mpls-vc VC2 vs VS200
cfm service create vs VS200 name MA-200 level 4
cfm mep create service MA-200 port 3 type up mepid 21 vlan 200
cfm enable
snmp set community-string not-recognised
