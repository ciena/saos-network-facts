system config hostname RS_2
classifiers classifier CLASSIFIER-100 filter-entry vtag-stack vtags 1 vlan-id 100
fds fd ring_1-fd mode vpls
g8032-rings g8032-ring ring_2
  ring-id 2
  ring-ports ring-port port0 interface 1
  ring-ports ring-port port1 interface 2
  erp-instances erp-instance erp_2 raps-vid 4089
  erp-instances erp-instance erp_2 raps-level 7
  erp-instances erp-instance erp_2 erp-instance-construct sub-ring-no-virtual-channel
  erp-instances erp-instance erp_2 data-members ring_1-fd
  erp-instances erp-instance erp_2 wtr-timer 1
  erp-instances erp-instance erp_2 ports port port0 rpl none
  erp-instances erp-instance erp_2 ports port port1 rpl none
  exit
exit
fps fp ring_1-p0-fp classifier-list-precedence 7 fd-name ring_1-fd logical-port 1 mtu-size 2000 stats-collection on classifier-list CLASSIFIER-100
fps fp ring_1-p1-fp classifier-list-precedence 7 fd-name ring_1-fd logical-port 2 mtu-size 2000 stats-collection on classifier-list CLASSIFIER-100
logical-ports logical-port 2 admin-state disable
logical-ports logical-port 2 admin-state enable
