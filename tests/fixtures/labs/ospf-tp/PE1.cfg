# Synthetic SAOS 10 configuration for tests: OSPF and MPLS-TP co-routed tunnels.
config
system config hostname PE1
oc-if:interfaces interface lb0 config name lb0 type loopback
oc-if:interfaces interface lb0 ipv4 addresses address 192.0.2.11 config ip 192.0.2.11 prefix-length 32
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
oc-if:interfaces interface PE1-P1 config name PE1-P1 type ip mtu 9000
oc-if:interfaces interface PE1-P1 config underlay-binding config fd FD-CORE-1
oc-if:interfaces interface PE1-P1 ipv4 addresses address 198.51.100.1 config ip 198.51.100.1 prefix-length 30
fds fd FD-CORE-1 mode vpls
fps fp FP-CORE-1 fd-name FD-CORE-1 logical-port 1 classifier-list UNTAGGED
mpls interfaces interface PE1-P1 label-switching true
oc-if:interfaces interface PE1-P2 config name PE1-P2 type ip mtu 9000
oc-if:interfaces interface PE1-P2 config underlay-binding config fd FD-CORE-2
oc-if:interfaces interface PE1-P2 ipv4 addresses address 198.51.100.9 config ip 198.51.100.9 prefix-length 30
fds fd FD-CORE-2 mode vpls
fps fp FP-CORE-2 fd-name FD-CORE-2 logical-port 2 classifier-list UNTAGGED
mpls interfaces interface PE1-P2 label-switching true
ospf instance 1 router-id 192.0.2.11
ospf instance 1 interfaces interface PE1-P1 type point-to-point
ospf instance 1 areas area 0.0.0.0 network 198.51.100.0/30
ospf instance 1 interfaces interface PE1-P2 type point-to-point metric 20
ospf instance 1 areas area 0.0.0.0 network 198.51.100.8/30
ospf instance 1 interfaces interface lb0
ospf instance 1 areas area 0.0.0.0 network 192.0.2.11/32
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 tunnel-type static-ingress-corouted tunnel-role-type primary reversion-hold-time 60
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 forward-out-segment next-hop-ip 198.51.100.2 forward-out-label 1001
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 reverse-in-segment reverse-in-label 1002
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 bfd-cfg-parms desired-min-tx-interval 10000 required-min-rx-interval 10000 accelerate true admin-down false
tp-corouted-tunnels tunnel TP-1-B 192.0.2.11 192.0.2.13 tunnel-type static-ingress-corouted tunnel-role-type backup primary-tunnel-configuration primary-tunnel-name TP-1 primary-tunnel-type static-ingress-corouted
tp-corouted-tunnels tunnel TP-1-B 192.0.2.11 192.0.2.13 forward-out-segment next-hop-ip 198.51.100.10 forward-out-label 1011
tp-corouted-tunnels tunnel TP-1-B 192.0.2.11 192.0.2.13 reverse-in-segment reverse-in-label 1012
tp-corouted-tunnels tunnel TP-1-B 192.0.2.11 192.0.2.13 bfd-cfg-parms desired-min-tx-interval 10000 required-min-rx-interval 10000 accelerate true admin-down false
fds fd FD-VPWS-200 mode vpws
classifiers classifier VLAN200 filter-entry vtag-stack vtags 1 vlan-id 200
fps fp FP-AC-200 fd-name FD-VPWS-200 logical-port 3 classifier-list VLAN200
pseudowires pseudowire PW-200 mtu 1500 mode spoke tunnel-destination-ip 192.0.2.13 tunnel-name TP-1 tunnel-source-ip 192.0.2.11 tunnel-type static-ingress-corouted configured-pw peer-ip 192.0.2.13 pw-id 200 transmit-label 2001 receive-label 2001 pw-status true
l2vpn-services l2vpn VPWS-200 mtu 1500 signaling-type static forwarding-domain FD-VPWS-200 pseudowire PW-200
