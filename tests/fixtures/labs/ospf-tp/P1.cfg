# Synthetic SAOS 10 configuration for tests: OSPF and MPLS-TP co-routed tunnels.
config
system config hostname P1
oc-if:interfaces interface lb0 config name lb0 type loopback
oc-if:interfaces interface lb0 ipv4 addresses address 192.0.2.12 config ip 192.0.2.12 prefix-length 32
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
oc-if:interfaces interface P1-PE1 config name P1-PE1 type ip mtu 9000
oc-if:interfaces interface P1-PE1 config underlay-binding config fd FD-CORE-1
oc-if:interfaces interface P1-PE1 ipv4 addresses address 198.51.100.2 config ip 198.51.100.2 prefix-length 30
fds fd FD-CORE-1 mode vpls
fps fp FP-CORE-1 fd-name FD-CORE-1 logical-port 1 classifier-list UNTAGGED
mpls interfaces interface P1-PE1 label-switching true
oc-if:interfaces interface P1-PE2 config name P1-PE2 type ip mtu 9000
oc-if:interfaces interface P1-PE2 config underlay-binding config fd FD-CORE-2
oc-if:interfaces interface P1-PE2 ipv4 addresses address 198.51.100.5 config ip 198.51.100.5 prefix-length 30
fds fd FD-CORE-2 mode vpls
fps fp FP-CORE-2 fd-name FD-CORE-2 logical-port 2 classifier-list UNTAGGED
mpls interfaces interface P1-PE2 label-switching true
ospf instance 1 router-id 192.0.2.12
ospf instance 1 interfaces interface P1-PE1 type point-to-point
ospf instance 1 areas area 0.0.0.0 network 198.51.100.0/30
ospf instance 1 interfaces interface P1-PE2 type point-to-point
ospf instance 1 areas area 0.0.0.0 network 198.51.100.4/30
ospf instance 1 interfaces interface lb0
ospf instance 1 areas area 0.0.0.0 network 192.0.2.12/32
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 tunnel-type static-transit-corouted
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 forward-out-segment next-hop-ip 198.51.100.6 forward-out-label 1003
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 reverse-out-segment prev-hop-ip 198.51.100.1 reverse-out-label 1002
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 forward-in-segment forward-in-label 1001
tp-corouted-tunnels tunnel TP-1 192.0.2.11 192.0.2.13 reverse-in-segment reverse-in-label 1004
