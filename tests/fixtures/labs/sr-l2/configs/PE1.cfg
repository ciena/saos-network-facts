# Synthetic SAOS 10 configuration for tests.
config
system config hostname PE1
oc-if:interfaces interface lb0 config name lb0 type loopback
oc-if:interfaces interface lb0 ipv4 addresses address 192.0.2.1 config ip 192.0.2.1 prefix-length 32
fds fd FD-CORE-1 mode vpls
fds fd FD-VPWS-100 mode vpws
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
classifiers classifier VLAN100 filter-entry vtag-stack vtags 1 vlan-id 100
oc-if:interfaces interface PE1-PE2 config name PE1-PE2 type ip mtu 9000
oc-if:interfaces interface PE1-PE2 config underlay-binding config fd FD-CORE-1
oc-if:interfaces interface PE1-PE2 ipv4 addresses address 198.51.100.0 config ip 198.51.100.0 prefix-length 31
fps fp FP-CORE-1 fd-name FD-CORE-1 logical-port 1 classifier-list UNTAGGED
fps fp FP-AC-100 fd-name FD-VPWS-100 logical-port 3 classifier-list VLAN100
isis instance CORE level-type level-2 net 49.0001.1920.0000.2001.00
isis instance CORE interfaces interface lb0 interface-type point-to-point
isis instance CORE interfaces interface PE1-PE2 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface PE1-PE2 level-2 wide-metric 100
isis instance CORE segment-routing enabled true srgb 16000 23999
mpls interfaces interface PE1-PE2 label-switching true
mpls interfaces interface lb0 label-switching true
segment-routing connected-prefix-sid-map 192.0.2.1/32 interface lb0 start-sid 1 value-type index
segment-routing-traffic-engineering attributes segment-lists segment-list VIA-PE2 segments segment 1 segment-type-1 sid-value 16002
segment-routing-traffic-engineering policies policy "100" "192.0.2.2" name "to-PE2" source "192.0.2.1"
segment-routing-traffic-engineering policies policy "100" "192.0.2.2" candidate-paths candidate-path "local" "192.0.2.1" "100" preference 100 segment-lists segment-list VIA-PE2
bgp instance 65000 router-id 192.0.2.1 cluster-id 192.0.2.1
bgp instance 65000 peer 192.0.2.2 remote-as 65000
bgp instance 65000 peer 192.0.2.2 address-family l2vpn evpn activate true route-reflector-client true
bgp instance 65000 peer 192.0.2.2 address-family vpnv4 unicast activate true route-reflector-client true
pseudowires pseudowire PW-100 configured-pw peer-ip 192.0.2.2 pw-id 100
pseudowires pseudowire PW-100 mode spoke
l2vpn-services l2vpn VPWS-100 forwarding-domain FD-VPWS-100 pseudowire PW-100
maintenance-domain MD5 name-type character-string name MD5 md-level 5
maintenance-domain MD5 maintenance-association MA-100 name-type character-string name MA-100 component-list 1 fd-name FD-VPWS-100
maintenance-domain MD5 maintenance-association MA-100 ccm-interval 10ms
maintenance-domain MD5 maintenance-association MA-100 maintenance-association-end-point 11 interface FP-AC-100 direction up
