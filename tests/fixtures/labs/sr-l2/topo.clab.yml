# Synthetic two-PE SR-MPLS lab with a VPWS pseudowire and CFM (documentation addresses only).
name: sr-l2
topology:
  defaults:
    kind: ciena_saos
  nodes:
    PE1:
      type: '5164'
      startup-config: configs/PE1.cfg
    PE2:
      type: '5162'
      startup-config: configs/PE2.xml
    CE1:
      kind: linux
      image: alpine:3.20
  links:
    - endpoints: ["PE1:1", "PE2:1"]
    - endpoints: ["PE1:3", "CE1:eth1"]
