# Synthetic L3VPN lab with Linux hosts (private and documentation addresses only): PE1 - P1 - PE2 on
# IS-IS + SR-MPLS with a PE1 - PE2 backup link, P1 the VPNv4 / VPNv6 route reflector, VRF BLUE (per-VRF
# labels, dual-stack) between the test hosts h1 and h2, and the management VRF MGMT with a loopback per
# node and two DCN gateways on PE1 (floating static defaults, preference 10 and 20).
name: l3vpn-hosts
topology:
  defaults:
    kind: ciena_saos
    type: '5164'
  nodes:
    PE1:
      startup-config: configs/PE1.cfg
    P1:
      startup-config: configs/P1.cfg
    PE2:
      startup-config: configs/PE2.cfg
    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.10/24 dev eth1
        - ip -6 addr add 2001:db8:10::10/64 dev eth1
        - ip route replace default via 192.168.10.1
        - ip -6 route replace default via 2001:db8:10::1
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.20.20/24 dev eth1
        - ip addr add 192.168.120.1/24 dev lo
        - ip -6 addr add 2001:db8:20::20/64 dev eth1
        - ip route replace default via 192.168.20.1
        - ip -6 route replace default via 2001:db8:20::1
    dcn1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.60.255.1/31 dev eth1
        - ip route add 10.60.0.0/24 via 10.60.255.0
        - sysctl -w net.ipv4.ip_forward=1
    dcn2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.60.255.3/31 dev eth1
        - ip route add 10.60.0.0/24 via 10.60.255.2 metric 20
  links:
    - endpoints: ["PE1:1", "P1:1"]
    - endpoints: ["P1:2", "PE2:1"]
    - endpoints: ["PE1:2", "PE2:2"]
    - endpoints: ["PE1:5", "h1:eth1"]
    - endpoints: ["PE2:5", "h2:eth1"]
    - endpoints: ["PE1:6", "dcn1:eth1"]
    - endpoints: ["PE1:7", "dcn2:eth1"]
