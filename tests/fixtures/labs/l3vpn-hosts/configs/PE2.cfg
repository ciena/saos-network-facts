# Synthetic SAOS 10 configuration for tests: PE2 of the l3vpn-hosts lab (documentation and private addresses only).
config
system config hostname PE2
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
oc-if:interfaces interface lo0 config name lo0 type loopback description "router id and BGP source"
oc-if:interfaces interface lo0 ipv4 addresses address 10.255.0.3 config ip 10.255.0.3 prefix-length 32
isis instance CORE level-type level-2 net 49.0001.0100.0255.0003.00
isis instance CORE interfaces interface lo0 interface-type point-to-point
isis instance CORE segment-routing enabled true srgb 16000 23999
mpls interfaces interface lo0 label-switching true
segment-routing connected-prefix-sid-map 10.255.0.3/32 interface lo0 start-sid 3 value-type index
fds fd FD-PE2-P1 mode vpls
fps fp FP-PE2-P1 fd-name FD-PE2-P1 logical-port 1 classifier-list UNTAGGED
oc-if:interfaces interface PE2-P1 config name PE2-P1 type ip mtu 9000
oc-if:interfaces interface PE2-P1 config underlay-binding config fd FD-PE2-P1
oc-if:interfaces interface PE2-P1 ipv4 addresses address 10.0.23.1 config ip 10.0.23.1 prefix-length 31
isis instance CORE interfaces interface PE2-P1 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface PE2-P1 level-2 wide-metric 10
mpls interfaces interface PE2-P1 label-switching true
fds fd FD-PE2-PE1 mode vpls
fps fp FP-PE2-PE1 fd-name FD-PE2-PE1 logical-port 2 classifier-list UNTAGGED
oc-if:interfaces interface PE2-PE1 config name PE2-PE1 type ip mtu 9000
oc-if:interfaces interface PE2-PE1 config underlay-binding config fd FD-PE2-PE1
oc-if:interfaces interface PE2-PE1 ipv4 addresses address 10.0.13.1 config ip 10.0.13.1 prefix-length 31
isis instance CORE interfaces interface PE2-PE1 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface PE2-PE1 level-2 wide-metric 30
mpls interfaces interface PE2-PE1 label-switching true
vrf BLUE description "L3VPN for the test hosts"
fds fd FD-H2 mode vpls
fps fp FP-H2 fd-name FD-H2 logical-port 5 classifier-list UNTAGGED
oc-if:interfaces interface TO-H2 config name TO-H2 type ip vrfName BLUE
oc-if:interfaces interface TO-H2 config underlay-binding config fd FD-H2
oc-if:interfaces interface TO-H2 ipv4 addresses address 192.168.20.1 config ip 192.168.20.1 prefix-length 24
oc-if:interfaces interface TO-H2 ipv6 addresses address 2001:db8:20::1 config ip 2001:db8:20::1 prefix-length 64
vrf MGMT role management description "management (DCN)"
oc-if:interfaces interface lo-mgmt config name lo-mgmt type loopback vrfName MGMT description "management address"
oc-if:interfaces interface lo-mgmt ipv4 addresses address 10.60.0.3 config ip 10.60.0.3 prefix-length 32
bgp instance 64500 vrf MGMT route-distinguisher 0:64500:90
bgp instance 64500 vrf MGMT route-target 0:64500:900 direction both
bgp instance 64500 router-id 10.255.0.3
bgp instance 64500 address-family vpnv4 unicast route-reflector false
bgp instance 64500 address-family vpnv6 unicast route-reflector false
bgp instance 64500 peer 10.255.0.2 remote-as 64500 update-source-interface lo0
bgp instance 64500 peer 10.255.0.2 address-family vpnv4 unicast activate true
bgp instance 64500 peer 10.255.0.2 address-family vpnv6 unicast activate true
bgp instance 64500 vrf BLUE route-distinguisher 0:64500:20
bgp instance 64500 vrf BLUE route-target 0:64500:100 direction both
mpls label-management allocation-mode vrf BLUE address-family ipv4 mode per-vrf
mpls label-management allocation-mode vrf BLUE address-family ipv6 mode per-vrf
rib vrf BLUE ipv4 192.168.120.0/24 next-hop 192.168.20.20 description "lab LAN behind h2"
bgp instance 64500 vrf BLUE vrf-address-family ipv4 unicast redistribute connected
exit
exit
exit
exit
exit
bgp instance 64500 vrf BLUE vrf-address-family ipv4 unicast redistribute static
exit
exit
exit
exit
exit
bgp instance 64500 vrf BLUE vrf-address-family ipv6 unicast redistribute connected
exit
exit
exit
exit
exit
bgp instance 64500 vrf MGMT vrf-address-family ipv4 unicast redistribute connected
exit
exit
exit
exit
exit
