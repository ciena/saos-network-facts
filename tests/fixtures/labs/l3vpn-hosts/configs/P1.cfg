# Synthetic SAOS 10 configuration for tests: P1 of the l3vpn-hosts lab (documentation and private addresses only).
config
system config hostname P1
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
oc-if:interfaces interface lo0 config name lo0 type loopback description "router id and BGP source"
oc-if:interfaces interface lo0 ipv4 addresses address 10.255.0.2 config ip 10.255.0.2 prefix-length 32
isis instance CORE level-type level-2 net 49.0001.0100.0255.0002.00
isis instance CORE interfaces interface lo0 interface-type point-to-point
isis instance CORE segment-routing enabled true srgb 16000 23999
mpls interfaces interface lo0 label-switching true
segment-routing connected-prefix-sid-map 10.255.0.2/32 interface lo0 start-sid 2 value-type index
fds fd FD-P1-PE1 mode vpls
fps fp FP-P1-PE1 fd-name FD-P1-PE1 logical-port 1 classifier-list UNTAGGED
oc-if:interfaces interface P1-PE1 config name P1-PE1 type ip mtu 9000
oc-if:interfaces interface P1-PE1 config underlay-binding config fd FD-P1-PE1
oc-if:interfaces interface P1-PE1 ipv4 addresses address 10.0.12.1 config ip 10.0.12.1 prefix-length 31
isis instance CORE interfaces interface P1-PE1 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface P1-PE1 level-2 wide-metric 10
mpls interfaces interface P1-PE1 label-switching true
fds fd FD-P1-PE2 mode vpls
fps fp FP-P1-PE2 fd-name FD-P1-PE2 logical-port 2 classifier-list UNTAGGED
oc-if:interfaces interface P1-PE2 config name P1-PE2 type ip mtu 9000
oc-if:interfaces interface P1-PE2 config underlay-binding config fd FD-P1-PE2
oc-if:interfaces interface P1-PE2 ipv4 addresses address 10.0.23.0 config ip 10.0.23.0 prefix-length 31
isis instance CORE interfaces interface P1-PE2 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface P1-PE2 level-2 wide-metric 10
mpls interfaces interface P1-PE2 label-switching true
vrf MGMT role management description "management (DCN)"
oc-if:interfaces interface lo-mgmt config name lo-mgmt type loopback vrfName MGMT description "management address"
oc-if:interfaces interface lo-mgmt ipv4 addresses address 10.60.0.2 config ip 10.60.0.2 prefix-length 32
bgp instance 64500 vrf MGMT route-distinguisher 0:64500:90
bgp instance 64500 vrf MGMT route-target 0:64500:900 direction both
bgp instance 64500 router-id 10.255.0.2 cluster-id 10.255.0.2
bgp instance 64500 address-family vpnv4 unicast route-reflector true
bgp instance 64500 address-family vpnv6 unicast route-reflector true
bgp instance 64500 peer-group CLIENTS remote-as 64500 update-source-interface lo0
bgp instance 64500 peer-group CLIENTS address-family vpnv4 unicast activate true route-reflector-client true
bgp instance 64500 peer-group CLIENTS address-family vpnv6 unicast activate true route-reflector-client true
bgp instance 64500 peer 10.255.0.1 peer-group CLIENTS
bgp instance 64500 peer 10.255.0.3 peer-group CLIENTS
bgp instance 64500 vrf MGMT vrf-address-family ipv4 unicast redistribute connected
exit
exit
exit
exit
exit
