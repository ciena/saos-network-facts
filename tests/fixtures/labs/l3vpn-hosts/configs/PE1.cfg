# Synthetic SAOS 10 configuration for tests: PE1 of the l3vpn-hosts lab (documentation and private addresses only).
config
system config hostname PE1
classifiers classifier UNTAGGED filter-entry vtag-stack untagged-exclude-priority-tagged false
oc-if:interfaces interface lo0 config name lo0 type loopback description "router id and BGP source"
oc-if:interfaces interface lo0 ipv4 addresses address 10.255.0.1 config ip 10.255.0.1 prefix-length 32
isis instance CORE level-type level-2 net 49.0001.0100.0255.0001.00
isis instance CORE interfaces interface lo0 interface-type point-to-point
isis instance CORE segment-routing enabled true srgb 16000 23999
mpls interfaces interface lo0 label-switching true
segment-routing connected-prefix-sid-map 10.255.0.1/32 interface lo0 start-sid 1 value-type index
fds fd FD-PE1-P1 mode vpls
fps fp FP-PE1-P1 fd-name FD-PE1-P1 logical-port 1 classifier-list UNTAGGED
oc-if:interfaces interface PE1-P1 config name PE1-P1 type ip mtu 9000
oc-if:interfaces interface PE1-P1 config underlay-binding config fd FD-PE1-P1
oc-if:interfaces interface PE1-P1 ipv4 addresses address 10.0.12.0 config ip 10.0.12.0 prefix-length 31
isis instance CORE interfaces interface PE1-P1 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface PE1-P1 level-2 wide-metric 10
mpls interfaces interface PE1-P1 label-switching true
fds fd FD-PE1-PE2 mode vpls
fps fp FP-PE1-PE2 fd-name FD-PE1-PE2 logical-port 2 classifier-list UNTAGGED
oc-if:interfaces interface PE1-PE2 config name PE1-PE2 type ip mtu 9000
oc-if:interfaces interface PE1-PE2 config underlay-binding config fd FD-PE1-PE2
oc-if:interfaces interface PE1-PE2 ipv4 addresses address 10.0.13.0 config ip 10.0.13.0 prefix-length 31
isis instance CORE interfaces interface PE1-PE2 interface-type point-to-point level-type level-2
isis instance CORE interfaces interface PE1-PE2 level-2 wide-metric 30
mpls interfaces interface PE1-PE2 label-switching true
vrf BLUE description "L3VPN for the test hosts"
fds fd FD-H1 mode vpls
fps fp FP-H1 fd-name FD-H1 logical-port 5 classifier-list UNTAGGED
oc-if:interfaces interface TO-H1 config name TO-H1 type ip vrfName BLUE
oc-if:interfaces interface TO-H1 config underlay-binding config fd FD-H1
oc-if:interfaces interface TO-H1 ipv4 addresses address 192.168.10.1 config ip 192.168.10.1 prefix-length 24
oc-if:interfaces interface TO-H1 ipv6 addresses address 2001:db8:10::1 config ip 2001:db8:10::1 prefix-length 64
vrf MGMT role management description "management (DCN)"
oc-if:interfaces interface lo-mgmt config name lo-mgmt type loopback vrfName MGMT description "management address"
oc-if:interfaces interface lo-mgmt ipv4 addresses address 10.60.0.1 config ip 10.60.0.1 prefix-length 32
bgp instance 64500 vrf MGMT route-distinguisher 0:64500:90
bgp instance 64500 vrf MGMT route-target 0:64500:900 direction both
fds fd FD-DCN1 mode vpls
fps fp FP-DCN1 fd-name FD-DCN1 logical-port 6 classifier-list UNTAGGED
oc-if:interfaces interface TO-DCN1 config name TO-DCN1 type ip vrfName MGMT
oc-if:interfaces interface TO-DCN1 config underlay-binding config fd FD-DCN1
oc-if:interfaces interface TO-DCN1 ipv4 addresses address 10.60.255.0 config ip 10.60.255.0 prefix-length 31
fds fd FD-DCN2 mode vpls
fps fp FP-DCN2 fd-name FD-DCN2 logical-port 7 classifier-list UNTAGGED
oc-if:interfaces interface TO-DCN2 config name TO-DCN2 type ip vrfName MGMT
oc-if:interfaces interface TO-DCN2 config underlay-binding config fd FD-DCN2
oc-if:interfaces interface TO-DCN2 ipv4 addresses address 10.60.255.2 config ip 10.60.255.2 prefix-length 31
bgp instance 64500 router-id 10.255.0.1
bgp instance 64500 address-family vpnv4 unicast route-reflector false
bgp instance 64500 address-family vpnv6 unicast route-reflector false
bgp instance 64500 peer 10.255.0.2 remote-as 64500 update-source-interface lo0
bgp instance 64500 peer 10.255.0.2 address-family vpnv4 unicast activate true
bgp instance 64500 peer 10.255.0.2 address-family vpnv6 unicast activate true
bgp instance 64500 vrf BLUE route-distinguisher 0:64500:10
bgp instance 64500 vrf BLUE route-target 0:64500:100 direction both
mpls label-management allocation-mode vrf BLUE address-family ipv4 mode per-vrf
mpls label-management allocation-mode vrf BLUE address-family ipv6 mode per-vrf
rib vrf MGMT ipv4 0.0.0.0/0 next-hop 10.60.255.1 route-preference 10 description "DCN gateway 1"
rib vrf MGMT ipv4 0.0.0.0/0 next-hop 10.60.255.3 route-preference 20 description "DCN gateway 2 (floating)"
bgp instance 64500 vrf BLUE vrf-address-family ipv4 unicast redistribute connected
exit
exit
exit
exit
exit
bgp instance 64500 vrf BLUE vrf-address-family ipv6 unicast redistribute connected
exit
exit
exit
exit
exit
bgp instance 64500 vrf MGMT vrf-address-family ipv4 unicast redistribute connected
exit
exit
exit
exit
exit
bgp instance 64500 vrf MGMT vrf-address-family ipv4 unicast redistribute static
exit
exit
exit
exit
exit
