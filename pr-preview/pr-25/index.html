<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAOS network facts viewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='14' height='2' fill='%238b98a8'/%3E%3Crect x='1' y='5' width='14' height='2' fill='%233fb950'/%3E%3Crect x='1' y='1' width='14' height='2' fill='%23f778ba'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-BZhnbqTH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DmXVpqYL.css">
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="scene"></canvas></div>

      <aside id="controls" class="panel">
        <header>
          <h1>SAOS network facts</h1>
          <p class="sub" id="topo-name"></p>
        </header>

        <section>
          <h2>Facts</h2>
          <select id="lab-select" hidden aria-label="Lab"></select>
          <div class="row">
            <button id="facts-example" type="button" title="The Adaptive-SR-CFM lab bundled with this site">Example lab</button>
            <label class="file" title="A facts file written by saos-network-facts extract (schema 1.x)">Load your facts.json<input id="facts-file" type="file" accept=".json,application/json" /></label>
          </div>
          <p class="sub">A file you load stays in this browser: nothing is uploaded.</p>
          <p id="facts-error" class="warn" hidden></p>
        </section>

        <section>
          <h2>Layers</h2>
          <div id="layer-toggles"></div>
        </section>

        <section>
          <h2>Labels</h2>
          <div id="label-options">
            <label>Devices <select id="lbl-node" aria-label="Device labels"><option value="full">name and loopback</option><option value="name">name only</option></select></label>
            <label>iBGP <select id="lbl-bgp" aria-label="iBGP session labels"><option value="all">every session</option><option value="down">only sessions down</option><option value="none">none</option></select></label>
            <label><input id="lbl-lag" type="checkbox" checked />LAG labels</label>
            <label>Size <input id="lbl-scale" type="range" min="0.6" max="1.6" step="0.1" value="1" aria-label="Label size" /></label>
          </div>
        </section>

        <section>
          <h2>Walk</h2>
          <select id="walk-kind">
            <option value="vpws">VPWS frame over a pseudowire</option>
            <option value="ccm">CFM CCM stream (service MEG)</option>
            <option value="tp">MPLS-TP tunnel BFD CC</option>
            <option value="isis">IS-IS LSP flood</option>
            <option value="evpn">EVPN frame over SRv6</option>
            <option value="srv6">SRv6 packet to a locator</option>
            <option value="l3vpn">L3VPN packet (host / VRF to an address)</option>
            <option value="vpnupdate">BGP UPDATE of a VPN route</option>
          </select>
          <div id="walk-params" class="row"></div>
          <button id="walk-run" class="primary" type="button">Run walk</button>
        </section>

        <section>
          <h2>Failure</h2>
          <select id="fail-target" aria-label="Link or LAG member to fail"></select>
          <select id="fail-detection" aria-label="Failure detection">
            <option value="los">Loss of signal: interfaces go down at once</option>
          </select>
          <div class="row">
            <button id="fail-run" class="danger" type="button">Fail &amp; replay</button>
            <button id="fail-restore" type="button">Restore</button>
          </div>
          <p class="sub" id="fail-state"></p>
        </section>
      </aside>

      <aside id="detail" class="panel">
        <div class="tabs">
          <button data-tab="overview" class="active" type="button">Overview</button>
          <button data-tab="device" type="button">Device</button>
          <button data-tab="service" type="button">Service</button>
          <button data-tab="walk" type="button">Walk</button>
          <button data-tab="import" type="button">Import</button>
        </div>
        <div id="tab-overview"></div>
        <div id="tab-device" hidden><p class="sub">Click a device in the view or in the overview.</p></div>
        <div id="tab-service" hidden><p class="sub">Pick a service in the overview.</p></div>
        <div id="tab-walk" hidden>
          <h2 id="walk-title" class="title">No walk</h2>
          <ol id="step-list"></ol>
          <div id="step-detail"></div>
        </div>
        <div id="tab-import" hidden></div>
      </aside>

      <footer id="player" class="panel">
        <button id="p-prev" type="button" title="Previous step (&larr;)" aria-label="Previous step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zM19 5v14L8 12z"/></svg></button>
        <button id="p-play" type="button" title="Play / pause (space)" aria-label="Play or pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="p-play-icon" d="M7 5v14l12-7z"/></svg></button>
        <button id="p-next" type="button" title="Next step (&rarr;)" aria-label="Next step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l11-7zM17 5h2v14h-2z"/></svg></button>
        <span id="p-pos">0 / 0</span>
        <label>Speed <input id="p-speed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
        <button id="p-panels" type="button" title="Hide or show the panels (topology only)" aria-label="Toggle panels"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3zM3 11h18v2H3zM3 17h18v2H3z"/></svg></button>
      </footer>
    </div>
  </body>
</html>
