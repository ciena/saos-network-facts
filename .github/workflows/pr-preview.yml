# Pull-request previews of the example site. A PR from a branch of this repository is deployed
# to pr-preview/pr-N/ on the gh-pages branch, so it is live at
# https://ciena.github.io/saos-network-facts/pr-preview/pr-N/ with a sticky comment on the PR
# carrying the link; the preview is removed when the PR closes or merges. Every PR, fork PRs
# included, also gets the built site as the `site-preview` artifact of its run: download it and
# serve the folder (python3 -m http.server -d site-preview) to preview locally.
#
# A fork PR gets the artifact only: its GITHUB_TOKEN is read-only, so nothing can push gh-pages
# or comment on the PR. Fork code is only ever built under that read-only token (the `build`
# job); there is no pull_request_target here, so no fork code runs with a write token.
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# One group per PR (github.ref is refs/pull/N/merge for every event type above): runs of one PR
# are serialised, a newer push replaces a run still queued, and a deploy in progress completes.
concurrency:
  group: pr-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - name: Upload the site as the `site-preview` artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview
          path: viewer/dist
          retention-days: 14
      - name: Say where the preview is
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR: ${{ github.event.number }}
        run: |
          if [ "$SAME_REPO" = "true" ]; then
            echo "::notice::The preview job deploys this build to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr-preview/pr-$PR/ and comments the link on the PR."
          else
            echo "::notice::PR from a fork: no live preview (the token is read-only). Download this run's site-preview artifact and serve the folder: python3 -m http.server -d site-preview"
          fi

  preview:
    # Same-repo PRs only: a fork PR's token can neither push gh-pages nor comment. On `closed`
    # the build is skipped and the preview is removed; !cancelled() lets this job run then.
    needs: build
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes pr-preview/pr-N/ on gh-pages
      pull-requests: write # the sticky comment with the link
    steps:
      # The deploy action pushes from a checkout of the repository; the PR's code is not built here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event.action != 'closed'
        with:
          name: site-preview
          path: site
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # The default comment embeds a QR image fetched from a third-party host.
          qr-code: "false"
